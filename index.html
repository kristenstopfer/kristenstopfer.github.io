<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Website</title>
    <!-- LINK TO YOUR NEW CSS FILE BELOW -->
    <link rel="stylesheet" href="style.css">
</head>

    <!-- 1. HEADER: The top bar containing your logo and navigation link links -->
    <header>
        <h1>My Portfolio</h1>
        <nav>
            <a href="#about">About</a> | 
            <a href="#projects">Projects</a> | 
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- 2. MAIN: The unique core content of your specific webpage -->
    <main>

        <!-- 3. SECTIONS: Distinct thematic blocks of content -->
        <section id="about">
            <h2>About Me</h2>
            <p>I am learning how to build and host websites using GitHub Pages.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <p>Check out my latest web development work right here.</p>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Feel free to reach out via email or social media.</p>
        </section>

    </main>

    <!-- 4. FOOTER: The bottom bar for copyright, disclaimers, or secondary links -->
    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>

</body>
